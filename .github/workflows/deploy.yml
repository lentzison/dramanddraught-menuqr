name: Deploy to CapRover

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CapRover CLI
        run: npm i -g caprover

      - name: Deploy via App Token (non-interactive)
        env:
          CAPROVER_APP_TOKEN: ${{ secrets.CAPROVER_APP_TOKEN }}
          CAPROVER_URL: https://captain.apps.dramanddraught.com
          CAPROVER_APP: menuqr
          # Optionally override URL if your CapRover subdomain differs
          # CAPROVER_APP_URL: https://menuqr.apps.dramanddraught.com
        run: |
          chmod +x ./deploy-ci.sh
          ./deploy-ci.sh

